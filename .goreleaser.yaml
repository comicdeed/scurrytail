version: 2

project_name: scurrytail

before:
  hooks:
    - go mod tidy

builds:
  - id: scurrytail
    main: ./cmd/scurrytail
    binary: scurrytail
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Arch }}"
    files:
      - README.md
      - systemd/scurrytail.service
      - systemd/50-scurrytail.preset
      - scripts/install.sh

nfpms:
  - id: packages
    package_name: scurrytail
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: comicdeed
    homepage: https://github.com/comicdeed/scurrytail
    maintainer: comicdeed
    description: Nimble system tray kernel log watcher and error monitor
    license: MIT
    formats:
      - deb
      - rpm
    dependencies:
      - systemd
    contents:
      - src: systemd/scurrytail.service
        dst: /usr/lib/systemd/user/scurrytail.service
        file_info:
          mode: 0644
      - src: systemd/50-scurrytail.preset
        dst: /usr/lib/systemd/user-preset/50-scurrytail.preset
        file_info:
          mode: 0644
    scripts:
      preinstall: scripts/preinstall.sh
      postinstall: scripts/postinstall.sh
      preremove: scripts/prerm.sh

aurs:
  - name: scurrytail-bin
    homepage: https://github.com/comicdeed/scurrytail
    description: Nimble system tray kernel log watcher and error monitor
    maintainers:
      - comicdeed
    license: MIT
    private_key: '{{ .Env.AUR_KEY }}'
    git_url: 'ssh://aur@aur.archlinux.org/scurrytail-bin.git'
    package: |-
      install -Dm755 "${srcdir}/scurrytail" "${pkgdir}/usr/bin/scurrytail"
      install -Dm644 "${srcdir}/systemd/scurrytail.service" "${pkgdir}/usr/lib/systemd/user/scurrytail.service"
      install -Dm644 "${srcdir}/systemd/50-scurrytail.preset" "${pkgdir}/usr/lib/systemd/user-preset/50-scurrytail.preset"
    skip_upload: auto

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: comicdeed
    name: scurrytail
  prerelease: auto
  mode: replace

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
