version: 2

project_name: dmesg-watch

before:
  hooks:
    - go mod tidy

builds:
  - id: dmesg-watch
    main: ./cmd/dmesg-watch
    binary: dmesg-watch
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - README.md
      - systemd/dmesg-watch.service
      - systemd/50-dmesg-watch.preset
      - scripts/install.sh

nfpms:
  - id: packages
    package_name: dmesg-watch
    vendor: comicdeed
    homepage: https://github.com/comicdeed/dmesg-watch
    maintainer: comicdeed
    description: System tray kernel error monitor daemon
    license: MIT
    formats:
      - deb
      - rpm
    dependencies:
      - systemd
    contents:
      - src: systemd/dmesg-watch.service
        dst: /usr/lib/systemd/user/dmesg-watch.service
        file_info:
          mode: 0644
      - src: systemd/50-dmesg-watch.preset
        dst: /usr/lib/systemd/user-preset/50-dmesg-watch.preset
        file_info:
          mode: 0644
    scripts:
      preinstall: scripts/preinstall.sh
      postinstall: scripts/postinstall.sh
      preremove: scripts/prerm.sh

aurs:
  - name: dmesg-watch-bin
    homepage: https://github.com/comicdeed/dmesg-watch
    description: System tray kernel error monitor daemon
    maintainers:
      - comicdeed
    license: MIT
    private_key: '{{ .Env.AUR_KEY }}'
    git_url: 'ssh://aur@aur.archlinux.org/dmesg-watch-bin.git'
    package: |-
      install -Dm755 "${srcdir}/dmesg-watch" "${pkgdir}/usr/bin/dmesg-watch"
      install -Dm644 "${srcdir}/systemd/dmesg-watch.service" "${pkgdir}/usr/lib/systemd/user/dmesg-watch.service"
      install -Dm644 "${srcdir}/systemd/50-dmesg-watch.preset" "${pkgdir}/usr/lib/systemd/user-preset/50-dmesg-watch.preset"
    skip_upload: auto

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: comicdeed
    name: dmesg-watch
  prerelease: auto
  mode: replace

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
