version: 2

project_name: dmesg-watch

before:
  hooks:
    - go mod tidy

builds:
  - id: dmesg-watch
    main: ./cmd/dmesg-watch
    binary: dmesg-watch
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - README.md
      - systemd/dmesg-watch.service
      - scripts/install.sh

nfpms:
  - id: packages
    package_name: dmesg-watch
    vendor: codemedic
    homepage: https://github.com/codemedic/dmesg-watch
    maintainer: codemedic
    description: System tray kernel error monitor daemon
    license: MIT
    formats:
      - deb
      - rpm
    contents:
      - src: systemd/dmesg-watch.service
        dst: /usr/lib/systemd/user/dmesg-watch.service
        file_info:
          mode: 0644

aurs:
  - name: dmesg-watch-bin
    homepage: https://github.com/codemedic/dmesg-watch
    description: System tray kernel error monitor daemon
    maintainers:
      - codemedic
    license: MIT
    private_key: '{{ .Env.AUR_KEY }}'
    git_url: 'ssh://aur@aur.archlinux.org/dmesg-watch-bin.git'
    package: |-
      install -Dm755 "${srcdir}/dmesg-watch" "${pkgdir}/usr/bin/dmesg-watch"
      install -Dm644 "${srcdir}/systemd/dmesg-watch.service" "${pkgdir}/usr/lib/systemd/user/dmesg-watch.service"
    skip_upload: auto

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
