name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v0.1.0 or v0.1.0-beta.1)'
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    name: "Publish Release"
    # Trigger if: manual dispatch, pushed tag, or merged PR from a release/* branch
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Release Tag & Extract Notes
        id: release_meta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" =~ ^refs/tags/ ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # Extract version from branch name release/vX.Y.Z
            TAG="${PR_HEAD_REF#release/}"
          fi

          if [ -z "$TAG" ]; then
            echo "Error: Could not resolve release tag." >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Tag commit on main if triggered by PR merge
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.merged }}" = "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            if ! git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Tagging commit with $TAG..."
              git tag -a "$TAG" -m "Release $TAG"
              git push origin "$TAG"
            fi
          fi

          # Extract latest release notes section from CHANGELOG.md
          python3 -c "
          import re

          with open('CHANGELOG.md', 'r') as f:
              content = f.read()

          # Match from first '## [v...' up to next '## [v...' or EOF
          match = re.search(r'## \[v[^\]]+\][^\n]*\n(.*?)(?=\n## \[v|\Z)', content, re.DOTALL)
          notes = match.group(1).strip() if match else ''

          with open('release_notes.md', 'w') as f:
              f.write(notes + '\n')
          "

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --release-notes=release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
