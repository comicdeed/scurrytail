name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v0.1.0 or v0.1.0-beta.1)'
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    name: "Publish Release"
    # Trigger if: manual dispatch, pushed tag, or merged PR from a release/* branch
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Release Tag & Extract Notes
        id: release_meta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" =~ ^refs/tags/ ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # Extract version from branch name release/vX.Y.Z
            TAG="${PR_HEAD_REF#release/}"
          fi

          if [ -z "$TAG" ]; then
            echo "Error: Could not resolve release tag." >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Tag commit on main if triggered by PR merge
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.merged }}" = "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            if ! git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Tagging commit with $TAG..."
              git tag -a "$TAG" -m "Release $TAG"
              git push origin "$TAG"
            fi
          fi

          # Extract latest release notes section from CHANGELOG.md
          python3 -c "
          import re

          with open('CHANGELOG.md', 'r') as f:
              content = f.read()

          # Match from first '## [v...' up to next '## [v...' or EOF
          match = re.search(r'## \[v[^\]]+\][^\n]*\n(.*?)(?=\n## \[v|\Z)', content, re.DOTALL)
          notes = match.group(1).strip() if match else ''

          with open('/tmp/release_notes.md', 'w') as f:
              f.write(notes + '\n')
          "

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --release-notes=/tmp/release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}

      - name: Apply human-readable asset labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          echo "Applying Convention 1 labels to release assets for $TAG..."
          python3 - << 'EOF'
          import os, json, subprocess

          tag = os.environ["TAG"]
          repo = os.environ["GH_REPO"]

          cmd = ["gh", "api", f"repos/{repo}/releases/tags/{tag}", "--jq", ".assets[] | {id: .id, name: .name}"]
          try:
              output = subprocess.check_output(cmd, text=True)
          except Exception as e:
              print(f"Warning: Could not fetch release assets: {e}")
              exit(0)

          labels = {
              "checksums.txt": "SHA256 Checksums",
              "amd64.deb": "Debian / Ubuntu (x86_64)",
              "arm64.deb": "Debian / Ubuntu (aarch64 / ARM64)",
              "amd64.rpm": "Fedora / RHEL / openSUSE (x86_64)",
              "arm64.rpm": "Fedora / RHEL / openSUSE (aarch64 / ARM64)",
              "amd64.tar.gz": "Standalone Archive (x86_64)",
              "arm64.tar.gz": "Standalone Archive (aarch64 / ARM64)",
          }

          for line in output.strip().split("\n"):
              if not line:
                  continue
              asset = json.loads(line)
              asset_id = asset["id"]
              name = asset["name"]

              matched_label = None
              for pattern, label in labels.items():
                  if name.endswith(pattern) or name == pattern:
                      matched_label = label
                      break

              if matched_label:
                  print(f"Labeling {name} -> {matched_label}")
                  subprocess.call([
                      "gh", "api", "-X", "PATCH",
                      f"repos/{repo}/releases/assets/{asset_id}",
                      "-f", f"label={matched_label}"
                  ])
          EOF

      - name: Prune older pre-releases (Sliding window of 3)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Evaluating pre-releases for sliding-window retention (keeping 3 most recent)..."

          PRERELEASES=$(gh release list --limit 100 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease == true) | .tagName')

          COUNT=0
          KEEP=3
          for TAG in $PRERELEASES; do
            COUNT=$((COUNT + 1))
            if [ "$COUNT" -gt "$KEEP" ]; then
              echo "Pruning older pre-release: $TAG (rank #$COUNT, keeping newest $KEEP)..."
              gh release delete "$TAG" --yes || echo "Warning: Could not delete release $TAG"
            else
              echo "Keeping recent pre-release: $TAG (rank #$COUNT)"
            fi
          done
